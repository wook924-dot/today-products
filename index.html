<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
  <meta name="description" content="쇼츠에서 소개한 제품을 번호로 바로 찾아보세요.">
  <title>오늘 소개한 제품</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* Monochrome base + one accent. Tokens swap for dark mode; the page follows the system theme. */
    :root {
      color-scheme: light dark;
      --bg: #f4f4f5;
      --surface: #fcfcfc;
      --surface-2: #ececee;
      --ink: #18181b;
      --muted: #63636b;
      --line: #e1e1e5;
      --accent: #e8491d;
      --accent-ink: #b8360f;
      --on-accent: #fffaf8;
      --shadow: 0 1px 2px rgb(24 24 27 / .05), 0 8px 24px rgb(24 24 27 / .06);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f11;
        --surface: #18181b;
        --surface-2: #222226;
        --ink: #f1f1f3;
        --muted: #a4a4ad;
        --line: #2b2b30;
        --accent: #ff6a3d;
        --accent-ink: #ff8a66;
        --on-accent: #1a0c07;
        --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .35);
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-feature-settings: "tnum" 0;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }
    a, button { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }
    .num { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .wrap { width: min(1120px, 100%); margin: 0 auto; padding: 0 16px; }

    /* Top bar */
    .bar { display: flex; align-items: center; gap: 10px; height: 60px; }
    .brand { display: inline-flex; align-items: center; }
    .brand img { width: auto; height: 22px; }
    @media (min-width: 900px) { .brand img { height: 26px; } }

    /* Hero: title + number search, fits the first screen on phones */
    .hero { padding: 18px 0 8px; }
    .hero-grid { display: grid; gap: 22px; }
    h1 {
      margin: 0; font-size: clamp(32px, 8.4vw, 56px); line-height: 1.08;
      letter-spacing: -.045em; font-weight: 850;
    }
    h1 em { font-style: normal; color: var(--accent); }
    .lead { margin: 12px 0 0; max-width: 34ch; color: var(--muted); font-size: 16px; line-height: 1.55; }

    .finder { align-self: end; }
    .finder-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px;
      padding: 8px; border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px);
      background: var(--surface); box-shadow: var(--shadow);
    }
    .field { position: relative; display: flex; align-items: center; min-width: 0; }
    .field input {
      width: 100%; min-width: 0; height: 60px; padding: 0 52px 0 16px;
      border: 1px solid transparent; border-radius: var(--radius); outline: none;
      color: var(--ink); background: var(--surface-2);
      font: inherit; font-size: 26px; font-weight: 800; letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }
    .field input::placeholder { color: var(--muted); font-weight: 600; font-size: 17px; letter-spacing: 0; }
    .field input:focus-visible { border-color: var(--accent); }
    .field-unit { position: absolute; right: 16px; color: var(--muted); font-size: 18px; font-weight: 700; pointer-events: none; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--radius);
      color: var(--on-accent); background: var(--accent); cursor: pointer; text-decoration: none;
      font: inherit; font-size: 16px; font-weight: 800; white-space: nowrap;
      transition: transform .15s ease, filter .15s ease;
    }
    .finder .btn { height: 60px; padding: 0 24px; font-size: 17px; }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: scale(.98); }
    .btn:focus-visible, .text-link:focus-visible, .card:focus-visible, .field input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
    .status { min-height: 22px; margin: 10px 4px 0; color: var(--muted); font-size: 14px; }
    .status.error { color: var(--accent-ink); font-weight: 700; }
    .disclosure { margin: 6px 4px 0; color: var(--muted); font-size: 12.5px; line-height: 1.6; }

    /* Spotlight: newest product, or the one the visitor searched for */
    .spot { margin: 28px 0 8px; scroll-margin-top: 16px; }
    .spot-card {
      display: grid; overflow: hidden; border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px);
      background: var(--surface); box-shadow: var(--shadow);
    }
    .spot-media { position: relative; aspect-ratio: 4 / 3; background: #fff; }
    .spot-media img { width: 100%; height: 100%; object-fit: contain; }
    .spot-body { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
    .spot-label { margin: 0; color: var(--accent-ink); font-size: 14px; font-weight: 800; }
    .spot-code { margin: 0; font-size: clamp(44px, 12vw, 72px); line-height: .95; font-weight: 900; letter-spacing: -.05em; }
    .spot-code small { margin-left: 2px; font-size: .42em; font-weight: 800; letter-spacing: -.02em; color: var(--muted); }
    .spot-title { margin: 0; font-size: 21px; line-height: 1.35; font-weight: 800; letter-spacing: -.03em; }
    .spot-name { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .spot-price { margin: 0; font-size: 20px; font-weight: 800; }
    .spot-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 0 20px 20px; }
    .spot-actions .btn { min-height: 54px; padding: 0 26px; font-size: 17px; }
    .text-link { color: var(--ink); font-size: 15px; font-weight: 700; text-underline-offset: 4px; }
    .spot-card.swap { animation: swap .35s cubic-bezier(.16, 1, .3, 1); }
    @keyframes swap { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* All products */
    .list { padding: 40px 0 8px; }
    .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
    .count { color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card {
      display: flex; flex-direction: column; min-width: 0; overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--radius);
      color: inherit; background: var(--surface); text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      scroll-margin-top: 20px;
    }
    .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
    .card:active { transform: scale(.99); }
    .card.match { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .card-media { aspect-ratio: 1 / 1; background: #fff; }
    .card-media img { width: 100%; height: 100%; object-fit: contain; }
    .card-body { display: flex; flex: 1; flex-direction: column; gap: 6px; padding: 11px 12px 13px; }
    .card-code { margin: 0; font-size: 22px; line-height: 1; font-weight: 900; letter-spacing: -.04em; }
    .card-code small { font-size: 13px; font-weight: 800; color: var(--muted); margin-left: 1px; }
    .card-title { margin: 0; font-size: 14.5px; line-height: 1.4; font-weight: 700; letter-spacing: -.02em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .card-price { margin: auto 0 0; padding-top: 4px; color: var(--muted); font-size: 13.5px; font-weight: 700; }
    .img-fallback { object-fit: cover !important; }

    /* Loading and empty states */
    .skeleton { border-radius: var(--radius); background: linear-gradient(100deg, var(--surface-2) 30%, var(--surface) 50%, var(--surface-2) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
    .skeleton.card-sk { aspect-ratio: 3 / 4.3; }
    .skeleton.spot-sk { height: 420px; border-radius: calc(var(--radius) + 6px); }
    @keyframes shimmer { to { background-position: -150% 0; } }
    .empty { grid-column: 1 / -1; padding: 48px 20px; border: 1px dashed var(--line); border-radius: var(--radius); text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 16px; }

    footer { margin-top: 48px; padding: 22px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.7; }
    footer p { margin: 0 0 8px; }
    footer a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }
    .foot-links { display: flex; gap: 16px; }

    /* Phones and tablets: compact horizontal spotlight so the list starts right after it */
    @media (max-width: 899px) {
      .spot { margin-top: 18px; }
      .spot-card { grid-template-columns: 128px minmax(0, 1fr); }
      .spot-media { aspect-ratio: 1 / 1; align-self: start; margin: 12px 0 0 12px; border-radius: 10px; overflow: hidden; }
      .spot-body { gap: 5px; padding: 12px 14px 12px 12px; }
      .spot-label { font-size: 12px; }
      .spot-code { font-size: 34px; }
      .spot-title { font-size: 16px; line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      .spot-name { display: none; }
      .spot-price { font-size: 15px; }
      .spot-actions { grid-column: 1 / -1; justify-content: space-between; gap: 12px; margin: 0; padding: 0 12px 12px; }
      .spot-actions .btn { flex: 1; min-height: 48px; padding: 0 16px; font-size: 16px; }
      .text-link { font-size: 14px; }
      .list { padding-top: 28px; }
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    }
    @media (min-width: 900px) {
      .wrap { padding: 0 28px; }
      .bar { height: 68px; }
      .hero { padding: 40px 0 8px; }
      .hero-grid { grid-template-columns: 1.1fr 1fr; align-items: end; gap: 48px; }
      .spot-card { grid-template-columns: 1.05fr 1fr; grid-template-rows: 1fr auto; }
      .spot-media { grid-row: 1 / 3; aspect-ratio: auto; min-height: 440px; }
      .spot-body { justify-content: flex-end; padding: 40px 44px 0; gap: 14px; }
      .spot-actions { margin: 0; padding: 22px 44px 40px; }
      .spot-title { font-size: 26px; }
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <a class="brand" href="./" aria-label="PETIT.FUL 오늘 소개한 제품 처음으로">
        <img src="./media/brand/petitful-logo.png" alt="PETIT.FUL" width="703" height="96">
      </a>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-grid">
          <div>
            <h1 id="page-title">오늘 소개한 제품,<br><em>번호</em>로 찾으세요</h1>
            <p class="lead">쇼츠 마지막에 나온 제품번호를 입력하면 바로 보여드려요.</p>
          </div>
          <form class="finder" id="product-search" role="search" novalidate>
            <label class="sr-only" for="product-code">제품번호</label>
            <div class="finder-row">
              <div class="field">
                <input id="product-code" name="product" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="search" placeholder="예: 63" aria-describedby="search-status">
                <span class="field-unit" aria-hidden="true">번</span>
              </div>
              <button class="btn" type="submit">찾기</button>
            </div>
            <p class="status" id="search-status" role="status" aria-live="polite"></p>
            <p class="disclosure">일부 링크는 제휴 링크이며, 구매 시 운영자에게 일정액의 수수료가 제공될 수 있습니다. 가격과 판매 여부는 판매처에서 변경될 수 있습니다.</p>
          </form>
        </div>
      </section>

      <section class="spot" id="spotlight" aria-live="polite" aria-label="선택한 제품">
        <div class="skeleton spot-sk" aria-hidden="true"></div>
      </section>

      <section class="list" aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title">전체 제품</h2>
          <span class="count num" id="result-count"></span>
        </div>
        <div class="grid" id="products">
          <div class="skeleton card-sk" aria-hidden="true"></div>
          <div class="skeleton card-sk" aria-hidden="true"></div>
          <div class="skeleton card-sk" aria-hidden="true"></div>
          <div class="skeleton card-sk" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <footer>
      <p><strong>YouTube Automation</strong>은 운영자가 상품 쇼츠를 업로드하고 관리하기 위한 자동화 도구입니다.</p>
      <div class="foot-links">
        <a href="./privacy.html">개인정보처리방침</a>
        <a href="./terms.html">서비스 이용약관</a>
      </div>
    </footer>
  </div>

  <script>
    const spotlight = document.querySelector('#spotlight');
    const grid = document.querySelector('#products');
    const resultCount = document.querySelector('#result-count');
    const form = document.querySelector('#product-search');
    const input = document.querySelector('#product-code');
    const status = document.querySelector('#search-status');
    let catalog = [];

    // Only Coupang products are listed (2026-09-28).
    function isCoupang(item) {
      const declared = String(item.provider || '').toLowerCase();
      if (declared) return declared === 'coupang';
      return !/aliexpress|naver\./i.test(String(item.productUrl || ''));
    }

    // "쿠팡-63", "63번" and "63" all mean product 63.
    function codeNumber(value) {
      const compact = String(value || '').trim().replace(/\s+/g, '');
      const match = compact.match(/^(?:(?:알리|쿠팡|네이버)-?)?(\d+)번?$/);
      return match ? String(Number(match[1])) : '';
    }

    function price(value) {
      const n = Number(value);
      return Number.isFinite(n) && n > 0 ? `${Math.round(n).toLocaleString('ko-KR')}원` : '가격은 판매처에서 확인';
    }

    function hook(item) {
      return String(item.title || '').replace(/#shorts/gi, '').replace(/\s+/g, ' ').trim() || item.productName;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function image(item) {
      const img = el('img');
      img.alt = '';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.onerror = () => {
        img.onerror = null;
        if (item.videoId) {
          img.classList.add('img-fallback');
          img.src = `https://i.ytimg.com/vi/${encodeURIComponent(item.videoId)}/hqdefault.jpg`;
        } else {
          img.remove();
        }
      };
      img.src = item.productImage || '';
      return img;
    }

    function codeLine(className, item) {
      const line = el('p', `${className} num`, codeNumber(item.productCode));
      line.append(el('small', '', '번'));
      return line;
    }

    function renderSpotlight(item, found) {
      const card = el('article', 'spot-card swap');
      const media = el('div', 'spot-media');
      const img = image(item);
      img.fetchPriority = 'high';
      media.append(img);

      const body = el('div', 'spot-body');
      body.append(el('p', 'spot-label', found ? '찾은 제품' : '가장 최근에 소개한 제품'));
      body.append(codeLine('spot-code', item));
      body.append(el('h2', 'spot-title', hook(item)));
      body.append(el('p', 'spot-name', item.productName));
      body.append(el('p', 'spot-price num', price(item.priceSnapshot)));

      const actions = el('div', 'spot-actions');
      const go = el('a', 'btn', '쿠팡에서 보기');
      go.href = item.productUrl;
      go.target = '_blank';
      go.rel = 'sponsored nofollow noopener';
      actions.append(go);
      if (item.videoId) {
        const video = el('a', 'text-link', '영상 다시 보기');
        video.href = `https://www.youtube.com/shorts/${encodeURIComponent(item.videoId)}`;
        video.target = '_blank';
        video.rel = 'noopener';
        actions.append(video);
      }
      card.append(media, body, actions);
      spotlight.replaceChildren(card);
    }

    function renderCard(item) {
      const link = el('a', 'card');
      link.href = item.productUrl;
      link.target = '_blank';
      link.rel = 'sponsored nofollow noopener';
      link.dataset.code = codeNumber(item.productCode);
      link.setAttribute('aria-label', `${codeNumber(item.productCode)}번 ${item.productName}, 쿠팡에서 보기`);
      const media = el('div', 'card-media');
      const img = image(item);
      img.loading = 'lazy';
      media.append(img);
      const body = el('div', 'card-body');
      body.append(codeLine('card-code', item), el('p', 'card-title', hook(item)), el('p', 'card-price num', price(item.priceSnapshot)));
      link.append(media, body);
      return link;
    }

    function setUrl(code) {
      const url = new URL(location.href);
      url.searchParams.set('shop', 'coupang');
      if (code) url.searchParams.set('product', code); else url.searchParams.delete('product');
      history.replaceState(null, '', url);
    }

    function find(value, fromUser) {
      const code = codeNumber(value);
      input.value = code || String(value || '').trim();
      status.classList.remove('error');
      if (!code) {
        status.textContent = '숫자로 된 제품번호를 입력해주세요.';
        status.classList.add('error');
        return false;
      }
      const item = catalog.find(row => codeNumber(row.productCode) === code);
      if (!item) {
        status.textContent = `${code}번 제품을 찾지 못했어요. 번호를 다시 확인해주세요.`;
        status.classList.add('error');
        return false;
      }
      status.textContent = `${code}번 제품이에요.`;
      renderSpotlight(item, true);
      grid.querySelectorAll('.card.match').forEach(card => card.classList.remove('match'));
      const card = grid.querySelector(`.card[data-code="${code}"]`);
      if (card) card.classList.add('match');
      if (fromUser) {
        setUrl(code);
        spotlight.scrollIntoView({ behavior: 'smooth', block: 'start' });
        input.blur();
      }
      return true;
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      find(input.value, true);
    });

    fetch('./catalog.json', { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error('catalog'); return response.json(); })
      .then(items => {
        catalog = (Array.isArray(items) ? items : [])
          .filter(item => isCoupang(item) && codeNumber(item.productCode) && item.productUrl)
          .sort((a, b) => Number(codeNumber(b.productCode)) - Number(codeNumber(a.productCode)));
        resultCount.textContent = catalog.length ? `${catalog.length}개` : '';
        grid.replaceChildren(...catalog.map(renderCard));
        if (!catalog.length) {
          spotlight.replaceChildren();
          const empty = el('div', 'empty');
          empty.append(el('strong', '', '제품을 준비하고 있어요'), document.createTextNode('곧 새 제품을 소개할게요.'));
          grid.replaceChildren(empty);
          return;
        }
        const requested = new URLSearchParams(location.search).get('product');
        if (!requested || !find(requested, false)) renderSpotlight(catalog[0], false);
      })
      .catch(() => {
        spotlight.replaceChildren();
        const empty = el('div', 'empty');
        empty.append(el('strong', '', '잠시 후 다시 확인해주세요'), document.createTextNode('제품 목록을 불러오지 못했어요.'));
        grid.replaceChildren(empty);
        resultCount.textContent = '';
      });
  </script>
</body>
</html>
