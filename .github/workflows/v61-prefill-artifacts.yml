name: Prepare six V61 queue candidates

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover and package six approved products
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: gpt-5-mini
          OPENAI_VISION_MODEL: gpt-5-mini
          PYTHONPATH: src:verify-v61
        run: python src/refill_v61_queue.py --target-ready 6 --max-add 6 --scan-limit 36 --artifact-dir output/v61-prefill
      - uses: actions/upload-artifact@v4
        with:
          name: v61-prefill-six
          path: output/v61-prefill
          retention-days: 2
          if-no-files-found: error
